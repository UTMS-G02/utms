spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/utms_db}
    username: ${SPRING_DATASOURCE_USERNAME:utms_user}
    password: ${SPRING_DATASOURCE_PASSWORD:utms_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET:dXRtcy1zZWNyZXQta2V5LWZvci1qd3Qtc2lnbmluZy11dG1zLWcwMi0yMDI2}
  expiration-ms: 86400000

resend:
  api-key: ${RESEND_API_KEY:}

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}

server:
  port: ${PORT:8080}

logging:
  level:
    edu.iztech.utms: DEBUG
    org.springframework.security: DEBUG