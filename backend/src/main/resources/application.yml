spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/utms_db}
    username: ${SPRING_DATASOURCE_USERNAME:utms_user}
    password: ${SPRING_DATASOURCE_PASSWORD:utms_pass}
    driver-class-name: org.postgresql.Driver

  servlet:
    multipart:
      # Belge yükleme: tek dosya 10 MB (frontend ve DocumentService ile uyumlu),
      # çoklu belge yüklemesi için toplam istek limiti daha yüksek tutuldu.
      max-file-size: 10MB
      max-request-size: 100MB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mail:
    # Dev default: Mailpit (localhost:1025, auth/starttls kapalı).
    # Prod'da env ile gerçek SMTP'ye geçilir, örn:
    #   MAIL_HOST=smtp.gmail.com MAIL_PORT=587 MAIL_SMTP_AUTH=true
    #   MAIL_SMTP_STARTTLS=true MAIL_USERNAME=... MAIL_PASSWORD=...
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

jwt:
  secret: ${JWT_SECRET:dXRtcy1zZWNyZXQta2V5LWZvci1qd3Qtc2lnbmluZy11dG1zLWcwMi0yMDI2}
  expiration-ms: 86400000

resend:
  api-key: ${RESEND_API_KEY:}

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}

server:
  port: ${PORT:8080}

logging:
  level:
    edu.iztech.utms: DEBUG
    org.springframework.security: DEBUG